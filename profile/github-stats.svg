    <text class="streak-value streak-current" data-testid="current_streak" y="50">8 days</text>
    <text class="streak-note" y="79">AUG 26 – SEP 2</text>
  </g>
  <g transform="translate(784 307)">
    <text class="section-label">LONGEST STREAK</text>
    <text class="streak-value streak-longest" data-testid="longest_streak" y="50">48 days</text>
    <text class="streak-note" y="79">JUL 8 – AUG 24</text>
  </g>

  <line x1="56" y1="418" x2="1044" y2="418" stroke="#262b36"/>
  <text class="eyebrow" x="56" y="454">CONTRIBUTIONS · LAST 12 MONTHS</text>
