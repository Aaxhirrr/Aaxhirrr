    <text class="streak-note" y="79">JUL 8 – AUG 24</text>
  </g>

  <line x1="56" y1="418" x2="1044" y2="418" stroke="#262b36"/>
  <text class="eyebrow" x="56" y="454">CONTRIBUTIONS · LAST 12 MONTHS</text>
  <text class="eyebrow" x="1044" y="454" text-anchor="end">PEAK 806 / WEEK</text>
