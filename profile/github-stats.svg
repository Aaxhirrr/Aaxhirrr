  </g>

  <g transform="translate(650 176)">
    <text class="metric-label">REPOSITORIES</text>
    <text class="metric-value" data-testid="repos" y="45">68</text>
  </g>

  <g transform="translate(848 176)">
    <text class="metric-label">PR LINES CHANGED</text>
